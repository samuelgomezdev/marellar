name: Site (GitHub Pages)

# Publica o jogo para jogar no navegador, sem servidor: o motor Java vai compilado para
# JavaScript (marellar-web, TeaVM) e o cliente Godot exportado para Web.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Godot ${{ env.GODOT_VERSION }} e template web
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          # so o template web (10 MB) de dentro do pacote de 1,3 GB
          python3 web/baixar_template_web.py "${GODOT_VERSION}" "$HOME/.local/share/godot/export_templates"

      - name: Monta o site
        run: GODOT="$PWD/godot" bash web/montar_site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client-godot/export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
